    <div class="main-title">jun 2, 2026 - archive progress, transness, and artistic projects</div>
    <div class="para">Progress is going smoothly on the archive. Well, as smooth as it gets when you have ADHD. Stopping and starting, you know the drill. It's quite fun though, and I feel I've got the hang of it. Learning HTML/CSS at the same time has also been interesting. Well, learning the things I need to learn in order to get everything looking the way I want it to. Definitely helps that the creator of this template made everything pretty neat and tidy.
    </div>
    <div class="para">You can tell I got paragraph breaks working. Turns out, it wasn't as hard as I thought it would be. I'm unsure why learning all this on the fly seems so much easier than it used to be. Maybe that's the difference being medicated makes, I don't know.
    </div>
    <div class="para">I originally started this blog post on the 23rd of last month, after a wonderful night with some friends. In it, I ruminated on something which I've never been able to put into words before now. And by now, I mean I didn't find a good way to put it until yesterday. It's a common sentiment from trans people to say something like "I don't identify as [X], I <i>am</i> [X]." And that's a wonderful way to put it; a concise and effective way to push back against a certain breed of subtle transphobia. But the framing has never really resonated with me.
    </div>
    <div class="para">I am not ontologically anything. I am not inherently nonbinary, and I'm also not nonbinary because I identify as such. In fact, I don't identify as anything! I am not anything, and I don't care. For such a long time I was hung up on this or that, am I [X] or [Y], that kind of thing. And I slowly worked my way towards labels that more accurately reflected my feelings. But I never exactly got there. Like, if you put a gun to my head, I'd say like "genderfluid", but that's not exactly accurate. Most of the time, I don't even care about gender, only presentation. How I want others to perceive me. 
    </div>
    <div class="para">Anyways, I've been slowly writing again. Fingers crossed I'm sticking with it. This is a story I've dreamed up for a while called SIX CORNERS. It's a sort of cyberpunk detective thriller, though if you know one thing about me, I'm genre agnostic while my wife Tone is in the room. 
    </div>
